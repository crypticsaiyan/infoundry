id: create-pr
namespace: infoundry

description: Creates a GitHub Pull Request with generated IaC

inputs:
  - id: iac_bundle
    type: FILE
    required: true
    description: ZIP file containing generated IaC

  - id: repository
    type: STRING
    required: true
    defaults: "crypticsaiyan/infotest"
    description: GitHub repository (owner/repo format)

  - id: base_branch
    type: STRING
    required: false
    description: Base branch for PR (defaults to main)

  - id: target_folder
    type: STRING
    required: false
    defaults: "infra"
    description: Target folder in repo for Terraform files

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    outputFiles:
      - pr_result.json
    tasks:
      - id: download_iac
        type: io.kestra.plugin.core.storage.LocalFiles
        inputs:
          iac.zip: "{{ inputs.iac_bundle }}"

      - id: create_pr
        type: io.kestra.plugin.scripts.python.Script
        env:
          GITHUB_TOKEN: "{{ kv('GITHUB_TOKEN') }}"
          REPOSITORY: "{{ inputs.repository }}"
          BASE_BRANCH: "{{ inputs.base_branch ?? 'main' }}"
          TARGET_FOLDER: "{{ inputs.target_folder ?? 'infra' }}"
        script: |
          import json
          import os
          import zipfile
          import urllib.request
          import urllib.error
          from datetime import datetime

          github_token = os.environ.get("GITHUB_TOKEN", "")
          repository = os.environ.get("REPOSITORY", "")
          base_branch = os.environ.get("BASE_BRANCH", "main")
          target_folder = os.environ.get("TARGET_FOLDER", "infra")

          timestamp = datetime.utcnow().strftime("%Y%m%d-%H%M%S")
          branch_name = f"infoundry/iac-{timestamp}"

          # Extract IaC files
          with zipfile.ZipFile("iac.zip", "r") as zf:
              zf.extractall("iac_files")

          files = list(os.listdir("iac_files"))
          print(f"Extracted files: {files}")

          def github_api(method, endpoint, data=None):
              url = f"https://api.github.com/repos/{repository}{endpoint}"
              headers = {
                  "Authorization": f"token {github_token}",
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json"
              }
              req = urllib.request.Request(url, method=method, headers=headers)
              if data:
                  req.data = json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"GitHub API error: {e.code} {e.read().decode()}")
                  return None

          result = {
              "repository": repository,
              "branch": branch_name,
              "base_branch": base_branch,
              "files": files,
              "pr_url": None,
              "pr_number": None,
              "status": "pending"
          }

          if not github_token:
              print("No GITHUB_TOKEN configured - skipping PR creation")
              result["status"] = "skipped"
              result["message"] = "No GitHub token configured"
          else:
              # Get base branch SHA
              ref = github_api("GET", f"/git/refs/heads/{base_branch}")
              if ref:
                  base_sha = ref["object"]["sha"]
                  
                  # Create new branch
                  branch_data = {"ref": f"refs/heads/{branch_name}", "sha": base_sha}
                  branch_result = github_api("POST", "/git/refs", branch_data)
                  
                  if branch_result:
                      # Upload files to new branch
                      for filename in files:
                          filepath = f"iac_files/{filename}"
                          with open(filepath, "r") as f:
                              content = f.read()
                          
                          import base64
                          file_data = {
                              "message": f"Add {filename} via InFoundry",
                              "content": base64.b64encode(content.encode()).decode(),
                              "branch": branch_name
                          }
                          github_api("PUT", f"/contents/{target_folder}/{filename}", file_data)
                      
                      # Create PR
                      pr_data = {
                          "title": f"[InFoundry] Infrastructure Update {timestamp}",
                          "head": branch_name,
                          "base": base_branch,
                          "body": "This PR was automatically generated by InFoundry Architect."
                      }
                      pr = github_api("POST", "/pulls", pr_data)
                      
                      if pr:
                          result["pr_url"] = pr.get("html_url")
                          result["pr_number"] = pr.get("number")
                          result["status"] = "created"
                          print(f"PR created: {result['pr_url']}")
                      else:
                          result["status"] = "failed"
                          result["message"] = "Failed to create PR"
                  else:
                      result["status"] = "failed"
                      result["message"] = "Failed to create branch"
              else:
                  result["status"] = "failed"
                  result["message"] = "Failed to get base branch"

          with open("pr_result.json", "w") as f:
              json.dump(result, f, indent=2)
          print(json.dumps(result, indent=2))

outputs:
  - id: pr_result
    type: FILE
    value: "{{ outputs.working_dir.outputFiles['pr_result.json'] }}"
