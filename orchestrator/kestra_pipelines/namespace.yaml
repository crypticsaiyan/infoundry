id: namespace-config
namespace: infoundry

description: |
  Namespace configuration for InFoundry Architect.
  Contains shared variables, secrets references, and plugin configurations.

variables:
  # AI Provider Configuration (Ollama)
  OLLAMA_ENDPOINT: http://172.17.0.1:11434/v1
  AI_MODEL: qwen2.5:7b

  # Default configurations
  DEFAULT_CLOUD_PROVIDER: aws
  DEFAULT_IAC_FORMAT: terraform
  DEFAULT_TEST_ENVIRONMENT: localstack
  DEFAULT_REPOSITORY: crypticsaiyan/infotest
  DEFAULT_TARGET_FOLDER: infra

  # Timeout configurations
  TASK_TIMEOUT_MINUTES: 30
  PR_VALIDATION_TIMEOUT_MINUTES: 30

  # Retry configurations
  DEFAULT_MAX_RETRIES: 3
  DEFAULT_RETRY_INTERVAL: PT10S

pluginDefaults:
  # Default Python script configuration
  - type: io.kestra.plugin.scripts.python.Script
    values:
      docker:
        image: python:3.11-slim
      beforeCommands:
        - pip install --quiet requests

  # Terraform validation configuration
  - type: io.kestra.plugin.scripts.python.Script
    forced:
      docker:
        image: hashicorp/terraform:1.6
        entryPoint: [""]
      beforeCommands:
        - apk add --no-cache python3

  # Default Shell script configuration
  - type: io.kestra.plugin.scripts.shell.Script
    values:
      docker:
        image: alpine:latest

concurrency:
  limit: 5
  behavior: QUEUE

# Note: Secrets/KV should be configured in Kestra UI
# Available KV keys (configure these in Kestra → Settings → Key-Value Store):
#   - GITHUB_TOKEN: GitHub Personal Access Token for PR operations
#   - AWS_ACCESS_KEY_ID: AWS credentials for terraform plan (optional)
#   - AWS_SECRET_ACCESS_KEY: AWS credentials for terraform plan (optional)
#   - AWS_REGION: AWS region (default: us-east-1)

# Pipeline overview:
# 00-full-iac-pipeline: Complete orchestrated flow
# 01-ingest-repo: Parse GitHub repository
# 02-ingest-telemetry: Collect telemetry data
# 03-propose-architecture: AI-based architecture proposal (Oumi)
# 04-render-graph: Generate architecture graph
# 05-generate-iac: AI-powered Terraform generation (Kestra AI Agent + Ollama)
# 06-validate-iac: Terraform init, validate, fmt, plan
# 07-create-pr: Create GitHub PR with generated IaC
# 08-validate-pr: Monitor PR checks and CodeRabbit reviews
# 09-evaluate: AI-powered evaluation of deployment results

labels:
  project: infoundry
  team: platform
  environment: development

disabled: false
