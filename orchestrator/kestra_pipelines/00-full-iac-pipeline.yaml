id: full-iac-pipeline
namespace: infoundry

description: |
  Complete IaC generation pipeline with validation before PR creation.
  Flow: generate-iac → validate → create-pr (if validation passes)

inputs:
  - id: graph
    type: FILE
    required: true
    description: Graph JSON from render-graph flow

  - id: cloud_provider
    type: STRING
    required: true
    defaults: "aws"
    description: Target cloud provider

  - id: project_name
    type: STRING
    required: true
    defaults: "infoundry"
    description: Project name for resource naming

  - id: repository
    type: STRING
    required: true
    defaults: "crypticsaiyan/infotest"
    description: GitHub repository for PR

  - id: target_folder
    type: STRING
    required: true
    defaults: "infra"
    description: Target folder in repo for Terraform files

tasks:
  # Step 1: Generate Terraform IaC
  - id: generate_iac
    type: io.kestra.plugin.core.flow.Subflow
    flowId: generate-iac
    namespace: infoundry
    inputs:
      graph: "{{ inputs.graph }}"
      cloud_provider: "{{ inputs.cloud_provider }}"
      project_name: "{{ inputs.project_name }}"
    wait: true

  # Step 2: Validate the generated Terraform
  - id: validate_iac
    type: io.kestra.plugin.core.flow.Subflow
    flowId: validate-iac
    namespace: infoundry
    inputs:
      iac_bundle: "{{ outputs.generate_iac.outputs.iac_bundle }}"
    wait: true

  # Step 3: Check validation result and set flag
  - id: check_validation
    type: io.kestra.plugin.core.flow.WorkingDirectory
    outputFiles:
      - validation_check.json
    tasks:
      - id: download_result
        type: io.kestra.plugin.core.storage.LocalFiles
        inputs:
          deploy_result.json: "{{ outputs.validate_iac.outputs.deploy_result }}"

      - id: parse_result
        type: io.kestra.plugin.scripts.python.Script
        script: |
          import json

          with open("deploy_result.json") as f:
              result = json.load(f)

          # Properly parse JSON and check boolean value
          validation_passed = result.get("success", False) is True

          output = {
              "validation_passed": validation_passed,
              "deploy_status": result.get("deploy_status", "unknown"),
              "tests_passed": result.get("smoke_tests", {}).get("passed", 0),
              "tests_failed": result.get("smoke_tests", {}).get("failed", 0)
          }

          with open("validation_check.json", "w") as f:
              json.dump(output, f)

          print(json.dumps(output, indent=2))

  # Step 4: Create PR only if validation passed
  - id: create_pr
    type: io.kestra.plugin.core.flow.Subflow
    flowId: create-pr
    namespace: infoundry
    runIf: "{{ read(outputs.check_validation.outputFiles['validation_check.json']) | jq('.validation_passed') }}"
    inputs:
      iac_bundle: "{{ outputs.generate_iac.outputs.iac_bundle }}"
      repository: "{{ inputs.repository }}"
      target_folder: "{{ inputs.target_folder }}"
    wait: true

  # Step 5: Log the result
  - id: log_result
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: download_check
        type: io.kestra.plugin.core.storage.LocalFiles
        inputs:
          validation_check.json: "{{ outputs.check_validation.outputFiles['validation_check.json'] }}"

      - id: log_output
        type: io.kestra.plugin.scripts.python.Script
        script: |
          import json

          with open("validation_check.json") as f:
              check = json.load(f)

          validation_passed = check.get("validation_passed", False)

          if validation_passed:
              print("✅ Pipeline completed successfully!")
              print("   - IaC generated")
              print("   - Terraform validated")
              print("   - PR created")
          else:
              print("❌ Pipeline stopped: Terraform validation failed")
              print("   - IaC generated")
              print("   - Terraform validation FAILED")
              print("   - PR NOT created (validation must pass first)")

          print(f"\nValidation details:")
          print(f"   Status: {check.get('deploy_status')}")
          print(f"   Tests passed: {check.get('tests_passed')}")
          print(f"   Tests failed: {check.get('tests_failed')}")

outputs:
  - id: iac_bundle
    type: FILE
    value: "{{ outputs.generate_iac.outputs.iac_bundle }}"
    description: Generated IaC bundle

  - id: iac_manifest
    type: FILE
    value: "{{ outputs.generate_iac.outputs.iac_manifest }}"
    description: IaC manifest with AI decisions

  - id: validation_result
    type: FILE
    value: "{{ outputs.validate_iac.outputs.deploy_result }}"
    description: Terraform validation result

  - id: validation_check
    type: FILE
    value: "{{ outputs.check_validation.outputFiles['validation_check.json'] }}"
    description: Parsed validation check result

  - id: pr_result
    type: FILE
    value: "{{ outputs.create_pr.outputs.pr_result ?? null }}"
    description: PR creation result (null if validation failed)
