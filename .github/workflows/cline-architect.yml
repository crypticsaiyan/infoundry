name: Cline Architecture Bot

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  analyze-architecture:
    # Security: Only trigger for:
    # 1. Issues with 'architecture' label, OR
    # 2. Comments by trusted users (OWNER/MEMBER/COLLABORATOR) mentioning @cline on architecture-labeled issues
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'architecture')) ||
      (github.event_name == 'issue_comment' && 
        contains(github.event.comment.body, '@cline') && 
        contains(github.event.issue.labels.*.name, 'architecture') &&
        (github.event.comment.author_association == 'OWNER' || 
         github.event.comment.author_association == 'MEMBER' || 
         github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Cline CLI
        run: npm install -g cline
      
      - name: Setup Cline Auth
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: |
          mkdir -p ~/.config/cline
          echo '{"apiKey": "'$CLINE_API_KEY'"}' > ~/.config/cline/config.json
      
      - name: Build MCP Server
        working-directory: ./infoundry-mcp-server
        run: |
          npm install
          npm run build
      
      - name: Configure MCP Server
        run: |
          mkdir -p ~/.config/cline
          cat > ~/.config/cline/mcp.json << EOF
          {
            "mcpServers": {
              "infoundry-architect": {
                "command": "node",
                "args": ["${{ github.workspace }}/infoundry-mcp-server/dist/index.js"]
              }
            }
          }
          EOF
      
      - name: Analyze and Propose Architecture
        id: analyze
        env:
          # Pass issue body as environment variable to avoid shell injection
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Safely write issue context to a file using Python (no shell expansion)
          python3 -c "
          import os
          content = os.environ.get('ISSUE_BODY', '')
          # Sanitize: remove any potentially dangerous characters
          safe_content = content.replace('\`', '').replace('\$', '')[:2000]
          with open('issue_context.txt', 'w') as f:
              f.write(safe_content)
          "
          
          # Create prompt file safely
          cat > cline_prompt.txt << 'PROMPT_EOF'
          Using the infoundry-architect MCP tools:
          1. Run analyze_repo on this repository
          2. Run propose_architecture with the profile
          3. Run generate_iac to create Terraform in ./infra/generated
          4. Run validate_iac to check the output
          
          Read the issue context from issue_context.txt for additional requirements.
          
          Save the architecture summary to architecture_output.md
          PROMPT_EOF
          
          # Run cline with the prompt file
          cline -f cline_prompt.txt -f issue_context.txt "Execute the tasks in cline_prompt.txt"
          
          if [ -f architecture_output.md ]; then
            echo "output<<EOF" >> $GITHUB_OUTPUT
            cat architecture_output.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.analyze.outputs.output }}` || 'Analysis complete. Check workflow logs for details.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🏗️ InFoundry Architecture Analysis\n\n${output}\n\n---\n*Generated by Cline + InFoundry MCP Server*`
            });
      
      - name: Create PR with Terraform
        if: hashFiles('infra/generated/*.tf') != ''
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(infra): Add generated Terraform from architecture analysis"
          title: "🏗️ Architecture: Generated IaC from Issue #${{ github.event.issue.number }}"
          body: |
            ## Auto-generated Infrastructure
            
            This PR was created automatically by the Cline Architecture Bot based on Issue #${{ github.event.issue.number }}.
            
            ### Generated Files
            - `infra/generated/main.tf`
            - `infra/generated/variables.tf`
            - `infra/generated/outputs.tf`
            
            ### Review Checklist
            - [ ] Terraform plan reviewed
            - [ ] Cost estimation checked
            - [ ] Security review completed
            
            ---
            *Powered by InFoundry + Cline CLI*
          branch: feat/architecture-issue-${{ github.event.issue.number }}
          base: dev
